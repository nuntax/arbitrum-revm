[package]
name = "arb-revm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Extracted Arbitrum storage and layout primitives for revm extensions"

[dependencies]
eyre.workspace = true
hex.workspace = true
revm.workspace = true
revm-database.workspace = true
# reth node seam: `EvmInternals` (the state handle DynPrecompiles receive). Keep this on the
# alloy-evm release matching the workspace's revm version so this adds no second revm graph. Hosts the orphan-rule
# `impl ArbJournal for EvmInternals` that lets ArbOS precompiles run on the node path.
alloy-evm = { version = "0.38", default-features = false }
alloy-provider = { workspace = true, features = ["reqwest", "debug-api"] }
serde_json.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
tokio.workspace = true
tracing.workspace = true
metrics = "0.24"
alloy-rlp.workspace = true
alloy-trie = "0.9.5"
alloy-consensus = "2.0"
alloy-eips = "2.0"
alloy-core = "1.4.3"
alloy-rpc-client = "2.0"
alloy-transport = "2.0"
alloy-rpc-types-eth = "2.0"
alloy-rpc-types-trace = "2.0"
alloy-network-primitives = "2.0"
url = "2.5"
arbitrum-alloy-consensus = { git = "https://github.com/nuntax/arbitrum-alloy", rev = "83593650bf6d07d2255e8627c417a9236cd5d02b", features = ["k256"] }
arbitrum-alloy-sequencer = { git = "https://github.com/nuntax/arbitrum-alloy", rev = "83593650bf6d07d2255e8627c417a9236cd5d02b" }
arbitrum-alloy-precompiles = { git = "https://github.com/nuntax/arbitrum-alloy", rev = "fd8fc3522da466f7df7100d385ff9a7c40d39c01" }
arbitrum-alloy-rpc-types = { git = "https://github.com/nuntax/arbitrum-alloy", rev = "83593650bf6d07d2255e8627c417a9236cd5d02b" }
arbitrum-alloy-network = { git = "https://github.com/nuntax/arbitrum-alloy", rev = "83593650bf6d07d2255e8627c417a9236cd5d02b" }
# Brotli and every Stylus runtime crate come from one generated Nitro runtime revision. Keeping the
# source and revision identical is required so the runtime's Wasmer types unify.
brotli = { git = "https://github.com/nuntax/nitro-rust-runtime", rev = "d8d9611bd67f4d777894c52f5312ec89b4380e76", features = ["cc_brotli"] }

# Stylus WASM execution is feature-gated because the runtime and compiler are a heavy build.
stylus = { git = "https://github.com/nuntax/nitro-rust-runtime", rev = "d8d9611bd67f4d777894c52f5312ec89b4380e76", features = ["cc_brotli"], optional = true }
arbutil = { git = "https://github.com/nuntax/nitro-rust-runtime", rev = "d8d9611bd67f4d777894c52f5312ec89b4380e76", optional = true }
wasmer-types = { git = "https://github.com/nuntax/nitro-rust-runtime", rev = "d8d9611bd67f4d777894c52f5312ec89b4380e76", optional = true }
wasm-encoder = { version = "0.244.0", optional = true }
wasmparser = { version = "0.244.0", optional = true }
wasmprinter = { version = "0.244.0", optional = true }
lru = { version = "0.16.3", optional = true }
lazy_static = { version = "1.5.0", optional = true }

[features]
stylus = ["dep:stylus", "dep:arbutil", "dep:wasmer-types", "dep:wasm-encoder", "dep:wasmparser", "dep:wasmprinter", "dep:lru", "dep:lazy_static"]

[[bin]]
name = "replay_block"
path = "src/bin/replay_block.rs"
required-features = ["stylus"]
